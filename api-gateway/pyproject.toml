[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway"
authors = ["woody <woody@aicess.ai>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = "^0.32.1"
fastapi = "^0.115.6"
httpx = "^0.28.1"
colorama = "^0.4.6"
python-dotenv = "^1.0.1"
pyjwt = "^2.10.1"
pymongo = "^4.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
