[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway"
authors = ["woody <woody@aicess.ai>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = "^0.48.0"
fastapi = "^0.136.3"
httpx = "^0.28.1"
colorama = "^0.4.6"
python-dotenv = "^1.2.2"
pyjwt = "^2.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
