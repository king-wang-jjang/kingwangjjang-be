[tool.poetry]
name = "comment-service"
version = "0.1.0"
description = "comment microservice"
authors = ["hwanju <hwanju1596@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.111.1"
uvicorn = "0.30.1"
python-dotenv = "1.0.1"
colorama = "0.4.6"
pydantic = ">=2.5.0,<2.7.0"
sqlalchemy = "^2.0.36"
psycopg = { extras = ["binary"], version = "^3.2.3" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

