[tool.poetry]
name = "comment-service"
version = "0.1.0"
description = "comment microservice"
authors = ["hwanju <hwanju1596@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"
python-dotenv = "^1.2.2"
colorama = "^0.4.6"
pydantic = "^2.13.4"
sqlalchemy = "^2.0.50"
psycopg = {extras = ["binary"], version = "^3.3.4"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
