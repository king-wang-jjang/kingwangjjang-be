networks:
  kingwangjjang-network:
    external: true

volumes:
  kingwangjjang-postgres-data:

services:
  kingwangjjang-postgres:
    container_name: kingwangjjang-postgres
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kingwangjjang-postgres-data:/var/lib/postgresql/data
    networks:
      - kingwangjjang-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kingwangjjang-api-gateway:
    container_name: kingwangjjang-api-gateway
    image: ${DOCKERHUB_USERNAME}/api-gateway:0.0.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CRAWLER_MEDIA_ROOT: /app/public
    volumes:
      - ./logs:/var/log
      - ${CRAWLER_MEDIA_HOST_ROOT:-/mnt/kingwangjjang}:/app/public:ro
    networks:
      - kingwangjjang-network
    depends_on:
      - kingwangjjang-user-service
      - kingwangjjang-board-service
      - kingwangjjang-comment-service
      - kingwangjjang-gpt-service

  kingwangjjang-board-service:
    container_name: kingwangjjang-board-service
    image: ${DOCKERHUB_USERNAME}/board-service:0.0.1
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      CRAWLER_MEDIA_ROOT: /app/public
      AI_SERVICE_URL: http://kingwangjjang-gpt-service:33336
    volumes:
      - ./logs:/var/log
      - ${CRAWLER_MEDIA_HOST_ROOT:-/mnt/kingwangjjang}:/app/public:ro
    networks:
      - kingwangjjang-network
    depends_on:
      kingwangjjang-postgres:
        condition: service_healthy
      kingwangjjang-user-service:
        condition: service_started
      kingwangjjang-comment-service:
        condition: service_started
      kingwangjjang-gpt-service:
        condition: service_healthy

  kingwangjjang-gpt-service:
    container_name: kingwangjjang-gpt-service
    image: ${DOCKERHUB_USERNAME}/gpt-service:0.0.1
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      OPENAI_COMPATIBLE_DISABLE_THINKING: ${OPENAI_COMPATIBLE_DISABLE_THINKING:-TRUE}
      OPENAI_COMPATIBLE_MAX_TOKENS: ${OPENAI_COMPATIBLE_MAX_TOKENS:-512}
      OPENAI_COMPATIBLE_TEMPERATURE: ${OPENAI_COMPATIBLE_TEMPERATURE:-0}
    restart: unless-stopped
    volumes:
      - ./logs:/var/log
    networks:
      - kingwangjjang-network
    depends_on:
      kingwangjjang-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:33336/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  kingwangjjang-user-service:
    container_name: kingwangjjang-user-service
    image: ${DOCKERHUB_USERNAME}/user-service:0.0.1
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    volumes:
      - ./logs:/var/log
    networks:
      - kingwangjjang-network
    depends_on:
      - kingwangjjang-postgres

  kingwangjjang-comment-service:
    container_name: kingwangjjang-comment-service
    image: ${DOCKERHUB_USERNAME}/comment-service:0.0.1
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    volumes:
      - ./logs:/var/log
    networks:
      - kingwangjjang-network
    depends_on:
      - kingwangjjang-postgres
