version: '3.3'

services:
  kingwangjjang-be:
    image: hwanju1596/kingwangjjang-be:0.0.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - kingwangjjang-network
    restart: unless-stopped
    volumes:
      - ./logs:/var/log
  redis:
    image: redis:latest
    networks:
      - kingwangjjang-network
    restart: unless-stopped
    volumes:
      - ./logs:/var/log

networks:
  kingwangjjang-network:
    external: true