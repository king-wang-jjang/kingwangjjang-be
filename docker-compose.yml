version: "3.3"

networks:
  kingwangjjang-network:
    driver: bridge
    name: kingwangjjang-network

services:
  kingwangjjang-api-gateway:
    image: hwanju1596/api-gateway:0.0.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/var/log
    networks:
      - kingwangjjang-network

  kingwangjjang-board-service:
    image: hwanju1596/board-service:0.0.1
    env_file:
      - .env
    volumes:
      - ./logs:/var/log
    networks:
      - kingwangjjang-network

  kingwangjjang-user-service:
    image: hwanju1596/user-service:0.0.1
    env_file:
      - .env
    volumes:
      - ./logs:/var/log
    networks:
      - kingwangjjang-network
